<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .student-info {
            margin-top: 20px;
        }

        .row {
            display: flex;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .label {
            width: 150px;
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Details</h1>

        <div class="student-info">
            <div class="row">
                <div class="label">Name</div>
                <div class="value">John Doe</div>
            </div>

            <div class="row">
                <div class="label">Roll Number</div>
                <div class="value">CS101</div>
            </div>

            <div class="row">
                <div class="label">Course</div>
                <div class="value">B.Sc Computer Science</div>
            </div>

            <div class="row">
                <div class="label">Semester</div>
                <div class="value">4th Semester</div>
            </div>

            <div class="row">
                <div class="label">Email</div>
                <div class="value">john@example.com</div>
            </div>

            <div class="row">
                <div class="label">Phone</div>
                <div class="value">9876543210</div>
            </div>
        </div>
    </div>

</body>
</html>
